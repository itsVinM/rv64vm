[package]
name = "rv64vm"
version = "0.1.0"
edition = "2021"

[lib]
name = "rv64vm_core"
path = "src/lib.rs"

[[bin]]
name = "riscv-vm"
path = "src/bin/main.rs"

[features]
default = ["std"]
std = []

[dependencies]
bitflags = "2"
hashbrown = { version = "0.14", features = ["alloc", "raw"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1